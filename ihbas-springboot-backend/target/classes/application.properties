
spring.config.import=optional:file:./.env[.properties]

# ==================================================
# APPLICATION
# ==================================================
spring.application.name=ihbas-backend
server.port=${PORT:${SERVER_PORT:8080}}

# ==================================================
# DATABASE CONFIGURATION
# Local: XAMPP MariaDB
# Production: Railway MySQL
# ==================================================
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ihbas_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# ==================================================
# HIKARICP CONNECTION POOL
# ==================================================
spring.datasource.hikari.pool-name=IHBAS-HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# ==================================================
# SQL INITIALIZATION
# Schema managed manually through SQL script
# ==================================================
spring.sql.init.mode=never

# ==================================================
# ERROR HANDLING
# ==================================================
server.error.include-message=never
server.error.include-binding-errors=never

# ==================================================
# LOGGING
# ==================================================
logging.level.root=INFO
logging.level.com.ihbas.backend=DEBUG
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.zaxxer.hikari=INFO

# ==================================================
# JWT AUTHENTICATION
# Set APP_JWT_SECRET in Railway Variables
# ==================================================
app.jwt.secret=${APP_JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvcklIQkFTQXBwMjAyNg==}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# ==================================================
# OTP CONFIGURATION
# ==================================================
app.otp.dev-expose-code=${OTP_DEV_EXPOSE_CODE:false}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}

# ==================================================
# RESERVATION CONFIGURATION
# ==================================================
app.reservations.expiry-check-ms=${RESERVATION_EXPIRY_CHECK_MS:60000}

# ==================================================
# CORS CONFIGURATION
# Add your actual frontend origin in Railway Variables
# ==================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500}

# ==================================================
# ADMIN BOOTSTRAP
# Keep disabled when manually inserting admin in database
# ==================================================
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}

# ==================================================
# PATIENT DOCUMENT STORAGE
# Use persistent storage in production
# ==================================================
app.documents.directory=${IHBAS_DOCUMENT_DIRECTORY:./data/patient-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================================================
# RAZORPAY PAYMENT CONFIGURATION
# ==================================================
app.razorpay.enabled=${RAZORPAY_ENABLED:false}
app.razorpay.test-mode=${RAZORPAY_TEST_MODE:true}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}

# ==================================================
# MSG91 OTP DELIVERY
# ==================================================
app.msg91.enabled=${MSG91_ENABLED:false}
app.msg91.authkey=${MSG91_AUTHKEY:}
app.msg91.flow-template-id=${MSG91_OTP_TEMPLATE_ID:}
app.msg91.otp-variable=${MSG91_OTP_VARIABLE:OTP}
app.msg91.default-country-code=${MSG91_DEFAULT_COUNTRY_CODE:91}
app.msg91.endpoint=${MSG91_FLOW_ENDPOINT:https://control.msg91.com/api/v5/flow}
